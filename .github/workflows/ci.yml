name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?schema=public

jobs:
  checks:
    name: Lint, types, tests, SQL format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - id: install
        run: yarn install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn check:ts
      - name: Unit & integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test
      - name: SQL views formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn sql:format:check

  db-tests:
    name: Repository tests (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed database
        env:
          SMALL_SEED: "1"
        run: npx prisma db seed
      - name: Build test env file
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=\"${DATABASE_URL}\"" >> .env.test
      - name: Repository tests
        run: yarn test:db

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-auth-secret-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      OPERATEUR_PASSWORDS: password
      ACTUALISATION_YEAR: "2026"
      NEXT_PUBLIC_EMULATED_NOW: "2026-06-15T12:00:00Z"
      S3_URL: localhost
      S3_PORT: "9000"
      S3_USE_SSL: "0"
      S3_ACCESS: minioadmin
      S3_SECRET: minioadmin
      S3_BUCKET_NAME: bhasile-e2e
      SENTRY_AUTH_TOKEN: ""
      IS_PRODUCTION: "false"
      SMALL_SEED: "1"
      E2E_WORKERS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="${S3_ACCESS}" \
            -e MINIO_ROOT_PASSWORD="${S3_SECRET}" \
            minio/minio server /data
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          echo "MinIO n'a pas démarré :"
          docker logs minio
          exit 1
      - name: Build env file
        run: cp .env.example .env
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed database
        run: npx prisma db seed
      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build
        run: yarn build
      - name: E2E tests
        run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
