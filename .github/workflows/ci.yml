name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, SQL format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - id: install
        run: yarn install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn check:ts
      - name: Unit & integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test
      - name: SQL views formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn sql:format:check

  db-tests:
    name: Repository tests (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Seed database
        env:
          SMALL_SEED: "1"
        run: npx prisma db seed
      - name: Build test env file
        run: |
          cp .env.example .env.test
          echo "DATABASE_URL=\"${DATABASE_URL}\"" >> .env.test
      - name: Repository tests
        run: yarn test:db
